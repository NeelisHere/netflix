spring.application.name=encoding-service
server.port=8083

#================== kafka =====================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group=encoding-service-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.netflix.common_lib.dto.event

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#================== AWS =====================
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_BUCKET_NAME}

#================== folders =====================
ffmpeg.path=${FFMPEG_PATH:D:/ffmpeg/bin/ffmpeg.exe}
encoding.temp-dir=${TEMP_DIR:D:/temp/encoding}