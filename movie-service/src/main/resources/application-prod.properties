#================== kafka =====================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group=movie-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.netflix.common_lib.dto.event

#================== postgresql =====================

spring.datasource.url=jdbc:postgresql://ep-damp-cell-a4igy0yp-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update