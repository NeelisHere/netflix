#===============Redis================

spring.data.redis.host=localhost
spring.data.redis.port=6379

#===============Kafka===============

spring.kafka.bootstrap-servers=localhost:9091

spring.kafka.consumer.group=streaming-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.netflix.common_lib.dto.event

#=============================AWS================================

aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_BUCKET_NAME}
aws.s3.presigned-url-expiry=60